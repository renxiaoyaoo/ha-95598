type: custom:apexcharts-card
header:
  show: true
  title: 近180天每日电费
  show_states: false
apex_config:
  chart:
    height: 190
    toolbar:
      show: false
    background: transparent
  grid:
    borderColor: rgba(90,90,90,0.14)
    strokeDashArray: 2
  stroke:
    curve: smooth
    width: 2
  fill:
    type: gradient
    gradient:
      opacityFrom: 0.35
      opacityTo: 0.06
  dataLabels:
    enabled: false
  legend:
    show: false
  xaxis:
    type: datetime
    labels:
      datetimeUTC: false
      format: MM/dd
  tooltip:
    x:
      format: yyyy-MM-dd
    "y":
      formatter: |
        EVAL:function(value) { return value.toFixed(2) + ' 元'; }
series:
  - entity: sensor.95598_xxxx_daily_electricity_history_xxxx
    name: 电费
    unit: 元
    float_precision: 2
    type: area
    color: "#2f7d59"
    data_generator: |
      return (entity.attributes.series || [])
        .map((item) => {
          if (!item.date || item.charge === undefined || item.charge === null) return null;
          return [new Date(item.date + "T00:00:00").getTime(), Number(item.charge)];
        })
        .filter((point) => point && Number.isFinite(point[1]));
    extend_to: false
grid_options:
  columns: full
  rows: auto
now:
  show: false
graph_span: 180d
span:
  end: day
